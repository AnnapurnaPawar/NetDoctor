! ==========================================
! NetDoctor Campus Network: R2-Branch Configuration
! Role: Remote Branch Router & LAN Gateway
! ==========================================

enable
configure terminal
hostname R2-Branch
no ip domain-lookup

! Point-to-Point WAN Routed Link to R1-Campus
interface GigabitEthernet0/0/2
 description Routed WAN Link to R1-Campus
 ip address 10.10.99.2 255.255.255.252
 no shutdown
exit

! Local Branch Office LAN Gateway
interface GigabitEthernet0/0/1
 description Default Gateway for Branch Users (10.20.10.0/24)
 ip address 10.20.10.1 255.255.255.0
 no shutdown
exit

! Static Route to all Main Campus subnets (10.10.0.0/16 summary)
ip route 10.10.0.0 255.255.0.0 10.10.99.1

end
write memory
