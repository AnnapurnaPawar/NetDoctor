! ==========================================
! NetDoctor Campus Network: SW-Branch Configuration
! Role: Remote Branch Office Access Switch
! ==========================================

enable
configure terminal
hostname SW-Branch
no ip domain-lookup

! Uplink to R2-Branch Router
interface GigabitEthernet0/1
 description Uplink to R2-Branch (Gi0/0/1)
 switchport mode access
 switchport access vlan 1
 no shutdown
exit

! Branch PC Access Port
interface FastEthernet0/1
 description Access Port for PC-Branch-1
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
 no shutdown
exit

end
write memory
