! ==========================================
! NetDoctor Campus Network: SW-Faculty Configuration
! Role: Faculty Department Access Switch
! ==========================================

enable
configure terminal
hostname SW-Faculty
no ip domain-lookup

vlan 20
 name Faculty
exit

! 802.1Q Trunk Uplink to SW-Core
interface FastEthernet0/24
 description Trunk Uplink to SW-Core (Fa0/2)
 switchport mode trunk
 switchport trunk allowed vlan 20
 no shutdown
exit

! Faculty Workstation Access Ports
interface FastEthernet0/1
 description Access Port for PC-Faculty-1
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/2
 description Access Port for PC-Faculty-2
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

end
write memory
