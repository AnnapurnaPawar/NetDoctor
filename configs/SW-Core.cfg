! ==========================================
! NetDoctor Campus Network: SW-Core Configuration
! Role: Campus Core & Distribution Switch
! ==========================================

enable
configure terminal
hostname SW-Core
no ip domain-lookup

! Create Campus VLANs
vlan 10
 name Students
vlan 20
 name Faculty
vlan 30
 name Servers
exit

! 802.1Q Trunk Uplink to R1-Campus
interface GigabitEthernet0/1
 description 802.1Q Trunk to R1-Campus (Gi0/0/0)
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

! 802.1Q Trunk to SW-Students
interface FastEthernet0/1
 description Trunk Link to SW-Students (Fa0/24)
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

! 802.1Q Trunk to SW-Faculty
interface FastEthernet0/2
 description Trunk Link to SW-Faculty (Fa0/24)
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

! Access Port for DNS Server (VLAN 30)
interface FastEthernet0/10
 description Access Port for DNS Server
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

! Access Port for Web Server (VLAN 30)
interface FastEthernet0/11
 description Access Port for Campus Web Server
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

end
write memory
