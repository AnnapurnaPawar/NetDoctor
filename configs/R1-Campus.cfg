! ==========================================
! NetDoctor Campus Network: R1-Campus Configuration
! Role: Main Campus Router, Inter-VLAN Routing & WAN Gateway
! ==========================================

enable
configure terminal
hostname R1-Campus
no ip domain-lookup

! Enable physical trunk interface connecting to SW-Core
interface GigabitEthernet0/0/0
 description Trunk Link to SW-Core (Gi0/1)
 no shutdown
exit

! Subinterface for VLAN 10 (Students Department)
interface GigabitEthernet0/0/0.10
 description Default Gateway for Students (VLAN 10)
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 no shutdown
exit

! Subinterface for VLAN 20 (Faculty Department)
interface GigabitEthernet0/0/0.20
 description Default Gateway for Faculty (VLAN 20)
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 no shutdown
exit

! Subinterface for VLAN 30 (Server Farm)
interface GigabitEthernet0/0/0.30
 description Default Gateway for Campus Servers (VLAN 30)
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 no shutdown
exit

! Point-to-Point WAN Routed Link to R2-Branch
interface GigabitEthernet0/0/2
 description Routed WAN Link to R2-Branch
 ip address 10.10.99.1 255.255.255.252
 no shutdown
exit

! Static Route to Remote Branch Office Subnet
ip route 10.20.10.0 255.255.255.0 10.10.99.2

end
write memory
