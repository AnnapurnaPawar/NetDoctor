! ==========================================
! NetDoctor Campus Network: SW-Students Configuration
! Role: Student Department Access Switch
! ==========================================

enable
configure terminal
hostname SW-Students
no ip domain-lookup

vlan 10
 name Students
exit

! 802.1Q Trunk Uplink to SW-Core
interface FastEthernet0/24
 description Trunk Uplink to SW-Core (Fa0/1)
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
exit

! Student Workstation Access Ports
interface FastEthernet0/1
 description Access Port for PC-Student-1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/2
 description Access Port for PC-Student-2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

end
write memory
